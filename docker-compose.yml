# Data Manager Portal — Phase 1: Postgres, MinIO (S3), backend, DB admin, S3 admin.
# Copy .env.example to .env and run: docker-compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: dmp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dmp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dmp_secret}
      POSTGRES_DB: ${POSTGRES_DB:-dmp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dmp} -d ${POSTGRES_DB:-dmp}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO: S3 API on 9000, built-in Console (S3 admin UI) on 9001 — one container per plan for storage, separate port for admin UI
  minio:
    image: minio/minio:latest
    container_name: dmp-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  # Create S3 buckets on first run (bulk-uploads, exports)
  s3-init:
    image: minio/mc:latest
    container_name: dmp-s3-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb myminio/bulk-uploads --ignore-existing;
      mc mb myminio/exports --ignore-existing;
      echo Buckets ready;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dmp-backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://dmp:dmp_secret@postgres:5432/dmp}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-dev-secret-change-in-production-32chars}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AUTH_DEV_ALWAYS_LOGGED_IN: ${AUTH_DEV_ALWAYS_LOGGED_IN:-false}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  backend-spring:
    build:
      context: ./backend-spring
      dockerfile: Dockerfile
    container_name: dmp-backend-spring
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dmp}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-dev-secret-change-in-production-32chars}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-dmp}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-dmp_secret}
      SERVER_PORT: "8081"
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_USE_LOCAL: ${S3_USE_LOCAL:-false}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  # DB admin (separate container per plan)
  db-admin:
    image: adminer:latest
    container_name: dmp-db-admin
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DEFAULT_USERNAME: ${POSTGRES_USER:-dmp}
      ADMINER_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD:-dmp_secret}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
