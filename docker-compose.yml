# Data Manager Portal — Phase 1: Postgres, MinIO (S3), backend, DB admin, S3 admin.
# Copy .env.example to .env and run: docker-compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: dmp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dmp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dmp_secret}
      POSTGRES_DB: ${POSTGRES_DB:-dmp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dmp} -d ${POSTGRES_DB:-dmp}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: dmp-minio
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"

  # S3 admin UI (separate container per plan)
  s3-admin:
    image: minio/console:latest
    container_name: dmp-s3-admin
    environment:
      CONSOLE_MINIO_ENDPOINT: http://minio:9000
    ports:
      - "9001:9001"
    depends_on:
      - minio
    command: server

  # Create S3 buckets on first run (bulk-uploads, exports)
  s3-init:
    image: minio/mc:latest
    container_name: dmp-s3-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb myminio/bulk-uploads --ignore-existing;
      mc mb myminio/exports --ignore-existing;
      echo Buckets ready;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dmp-backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://dmp:dmp_secret@postgres:5432/dmp}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # DB admin (separate container per plan)
  db-admin:
    image: adminer:latest
    container_name: dmp-db-admin
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DEFAULT_USERNAME: ${POSTGRES_USER:-dmp}
      ADMINER_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD:-dmp_secret}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
