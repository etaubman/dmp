spring:
  application:
    name: dmp-backend-spring
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dmp}
    username: ${SPRING_DATASOURCE_USERNAME:dmp}
    password: ${SPRING_DATASOURCE_PASSWORD:dmp_secret}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public

server:
  port: ${SERVER_PORT:8081}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors-origins: ${CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  s3:
    endpoint-url: ${S3_ENDPOINT_URL:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket-uploads: ${S3_BUCKET_UPLOADS:bulk-uploads}
    bucket-exports: ${S3_BUCKET_EXPORTS:exports}
    use-local: ${S3_USE_LOCAL:false}
  auth:
    jwt-secret: ${AUTH_JWT_SECRET:dev-secret-change-in-production-32chars}
    jwt-algorithm: ${AUTH_JWT_ALGORITHM:HS256}
    jwt-expire-minutes: ${AUTH_JWT_EXPIRE_MINUTES:60}
    dev-always-logged-in: ${AUTH_DEV_ALWAYS_LOGGED_IN:false}
    dev-user-email: "ethan.taubman@example.com"
