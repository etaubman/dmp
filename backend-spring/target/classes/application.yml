spring:
  application:
    name: dmp-backend-spring
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dmp}
    username: ${SPRING_DATASOURCE_USERNAME:dmp}
    password: ${SPRING_DATASOURCE_PASSWORD:dmp_secret}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public

server:
  port: ${SERVER_PORT:8081}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  auth:
    jwt-secret: ${AUTH_JWT_SECRET:dev-secret-change-in-production}
    jwt-algorithm: ${AUTH_JWT_ALGORITHM:HS256}
    jwt-expire-minutes: ${AUTH_JWT_EXPIRE_MINUTES:60}
    dev-always-logged-in: ${AUTH_DEV_ALWAYS_LOGGED_IN:false}
    dev-user-email: "ethan.taubman@example.com"
