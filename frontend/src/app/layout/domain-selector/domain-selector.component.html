<div class="domain-selector domain-selector-block">
  <label class="domain-selector-label">Domain</label>
  <div *ngIf="loading" class="domain-selector-loading">Loading domains…</div>
  <div *ngIf="error" class="domain-selector-error">
    {{ error }}
    <button type="button" (click)="refreshDomains()" class="domain-selector-retry">Retry</button>
  </div>
  <div *ngIf="!loading && !error" class="domain-selector-trigger-wrap">
    <button
      type="button"
      class="domain-selector-trigger"
      [class.open]="dropdownOpen"
      [disabled]="domains.length === 0"
      (click)="toggleDropdown()"
      [attr.aria-haspopup]="'listbox'"
      [attr.aria-expanded]="dropdownOpen"
      aria-label="Select domain"
    >
      <span class="domain-selector-trigger-text">{{ currentDomainName }}</span>
      <span class="domain-selector-chevron" aria-hidden="true"></span>
    </button>
    <div
      class="domain-selector-panel"
      [class.open]="dropdownOpen"
      role="listbox"
      aria-label="Domain hierarchy"
    >
      <button
        type="button"
        class="domain-selector-option domain-selector-option-root"
        [class.selected]="currentDomainId === null"
        role="option"
        (click)="selectDomain(null)"
      >
        <span class="domain-selector-option-label">Select domain</span>
      </button>
      <ng-container *ngTemplateOutlet="treeNodes; context: { nodes: domainsTree, depth: 0 }"></ng-container>
    </div>
  </div>
</div>

<ng-template #treeNodes let-nodes="nodes" let-depth="depth">
  <ng-container *ngFor="let node of (nodes || [])">
    <button
      type="button"
      class="domain-selector-option"
      [class.selected]="currentDomainId === node.id"
      [class.depth-child]="depth > 0"
      [style.--depth]="depth"
      role="option"
      (click)="selectDomain(node.id)"
    >
      <span class="domain-selector-level">L{{ node.level }}</span>
      <span class="domain-selector-option-label">{{ node.name }}</span>
    </button>
    <ng-container *ngIf="node.children?.length">
      <ng-container *ngTemplateOutlet="treeNodes; context: { nodes: node.children, depth: depth + 1 }"></ng-container>
    </ng-container>
  </ng-container>
</ng-template>
