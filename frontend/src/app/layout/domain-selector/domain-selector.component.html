<div class="p-3" style="border-bottom: 1px solid rgba(255,255,255,0.06);">
  <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-2">Domain</label>
  <select
    [ngModel]="currentDomainId"
    (ngModelChange)="selectDomain($event)"
    class="w-full rounded-input px-3 py-2 text-sm text-gray-200 bg-aurora-card focus:ring-1 focus:ring-accent focus:outline-none"
    style="border: 1px solid rgba(255,255,255,0.08);"
  >
    <option [ngValue]="null">Select domain</option>
    <option *ngFor="let d of domains$ | async" [ngValue]="d.id">{{ d.name }}</option>
  </select>
</div>
