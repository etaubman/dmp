<div class="p-3 border-b border-slate-700">
  <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider mb-2">Domain</label>
  <select
    [ngModel]="currentDomainId"
    (ngModelChange)="selectDomain($event)"
    class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-sm text-slate-200 focus:ring-1 focus:ring-sky-500 focus:border-sky-500"
  >
    <option [ngValue]="null">Select domain</option>
    <option *ngFor="let d of domains$ | async" [ngValue]="d.id">{{ d.name }}</option>
  </select>
</div>
