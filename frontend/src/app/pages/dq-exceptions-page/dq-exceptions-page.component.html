<div class="flex flex-col flex-1 min-h-0 overflow-hidden">
  <div class="flex flex-wrap items-center justify-between gap-4 mb-4 flex-shrink-0">
    <div class="min-w-0">
      <h2 class="text-xl font-semibold text-gray-100 mb-1">Data Quality Exceptions</h2>
      <p class="text-gray-500 text-sm">Select a domain to load exceptions.</p>
    </div>
    <div class="flex-shrink-0">
      <app-time-period-switch></app-time-period-switch>
    </div>
  </div>
  <app-concept-metrics *ngIf="!loading" [metrics]="metrics"></app-concept-metrics>
  <div *ngIf="loading" class="text-accent mb-4">Loading…</div>
  <div *ngIf="!loading && exceptions.length === 0" class="text-gray-500 mb-4">No data quality exceptions.</div>
  <div class="flex flex-1 min-h-0 gap-gutter" *ngIf="!loading && exceptions.length > 0">
    <div class="main-content" [class.main-content--panel-open]="selectedItem">
      <div class="ag-theme-quartz h-full min-h-[200px]">
        <ag-grid-angular
          theme="legacy"
          [rowData]="exceptions"
          [columnDefs]="columnDefs"
          [defaultColDef]="defaultColDef"
          [suppressRowClickSelection]="true"
          (rowClicked)="onRowClicked($event.data)"
          [getRowId]="getRowId"
          class="ag-grid-full-height"
        ></ag-grid-angular>
      </div>
    </div>
    <app-detail-panel [title]="panelTitle" [rows]="panelRows" [open]="!!selectedItem" (openChange)="closePanel()"></app-detail-panel>
  </div>
</div>
