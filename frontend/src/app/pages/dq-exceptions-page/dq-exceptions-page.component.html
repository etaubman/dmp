<div class="space-y-4">
  <h2 class="text-xl font-semibold text-gray-100">Data Quality Exceptions</h2>
  <p class="text-gray-500 text-sm">Select a domain to load exceptions.</p>
  <div *ngIf="loading" class="text-accent">Loading…</div>
  <div *ngIf="!loading && exceptions.length === 0" class="text-gray-500">No data quality exceptions.</div>
  <div *ngIf="!loading && exceptions.length > 0" class="card-aurora overflow-hidden">
    <table class="table-aurora min-w-full">
      <thead>
        <tr>
          <th class="px-4 py-3">Rule ID</th>
          <th class="px-4 py-3">Status</th>
          <th class="px-4 py-3">Description</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of exceptions" class="cursor-pointer" (click)="openDetail(item)">
          <td class="px-4 py-3 text-gray-200">{{ item.rule_id }}</td>
          <td class="px-4 py-3 text-gray-500 text-sm">{{ item.status ?? '—' }}</td>
          <td class="px-4 py-3 text-gray-500 text-sm">{{ item.description ?? '—' }}</td>
        </tr>
      </tbody>
    </table>
  </div>
  <app-detail-modal [title]="modalTitle" [rows]="modalRows" [(open)]="modalOpen"></app-detail-modal>
</div>
