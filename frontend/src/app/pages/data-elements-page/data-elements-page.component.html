<div class="space-y-4">
  <h2 class="text-xl font-semibold text-gray-100">Critical Data Elements</h2>
  <p class="text-gray-500 text-sm">Select a domain in the sidebar to load data elements.</p>
  <div *ngIf="loading" class="text-accent">Loading…</div>
  <div *ngIf="!loading && dataElements.length === 0" class="text-gray-500">No data elements. Select a domain or upload bulk data.</div>
  <div *ngIf="!loading && dataElements.length > 0" class="card-aurora overflow-hidden">
    <table class="table-aurora min-w-full">
      <thead>
        <tr>
          <th class="px-4 py-3">Name</th>
          <th class="px-4 py-3">Description</th>
          <th class="px-4 py-3">Type</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of dataElements" class="cursor-pointer" (click)="openDetail(item)">
          <td class="px-4 py-3 text-gray-200">{{ item.name }}</td>
          <td class="px-4 py-3 text-gray-500 text-sm">{{ item.description ?? '—' }}</td>
          <td class="px-4 py-3 text-gray-500 text-sm">{{ item.element_type ?? '—' }}</td>
        </tr>
      </tbody>
    </table>
  </div>
  <app-detail-modal [title]="modalTitle" [rows]="modalRows" [(open)]="modalOpen"></app-detail-modal>
</div>
