<div class="flex flex-col flex-1 min-h-0 overflow-hidden">
  <div class="flex flex-wrap items-center justify-between gap-4 mb-4 flex-shrink-0">
    <div class="min-w-0">
      <h2 class="text-xl font-semibold text-gray-100 mb-1">Critical Data Elements</h2>
      <p class="text-gray-500 text-sm">Select a domain in the sidebar to load data elements.</p>
    </div>
    <div class="flex-shrink-0">
      <app-time-period-switch></app-time-period-switch>
    </div>
  </div>
  <app-concept-metrics *ngIf="!loading && dataElements.length >= 0" [metrics]="metrics"></app-concept-metrics>
  <div class="flex gap-1 mb-3 flex-shrink-0" *ngIf="currentDomainId != null">
    <button type="button" class="domain-scope-tab" [class.domain-scope-tab--active]="domainScope === 'owned'" (click)="setDomainScope('owned')">Owned by Domain</button>
    <button type="button" class="domain-scope-tab" [class.domain-scope-tab--active]="domainScope === 'upstream'" (click)="setDomainScope('upstream')">Upstream of Domain</button>
    <button type="button" class="domain-scope-tab" [class.domain-scope-tab--active]="domainScope === 'downstream'" (click)="setDomainScope('downstream')">Downstream of Domain</button>
  </div>
  <div *ngIf="loading" class="text-accent mb-4">Loading…</div>
  <div *ngIf="!loading && dataElements.length === 0" class="text-gray-500 mb-4">No data elements. Select a domain or upload bulk data.</div>
  <div class="flex flex-1 min-h-0 gap-gutter" *ngIf="!loading && dataElements.length > 0">
    <div class="main-content" [class.main-content--panel-open]="selectedItem">
      <div class="ag-theme-quartz h-full min-h-[200px]">
        <ag-grid-angular
          theme="legacy"
          [rowData]="enrichedElements"
          [columnDefs]="columnDefs"
          [defaultColDef]="defaultColDef"
          [rowSelection]="{ mode: 'multiRow', enableClickSelection: false }"
          (rowClicked)="onRowClicked($event.data)"
          [getRowId]="getRowId"
          class="ag-grid-full-height"
        ></ag-grid-angular>
      </div>
    </div>
    <app-detail-panel
      [title]="panelTitle"
      [rows]="panelRows"
      [concerns]="panelConcerns"
      [endpoints]="panelEndpoints"
      [dqRules]="panelDqRules"
      [sors]="panelSors"
      [open]="!!selectedItem"
      (openChange)="closePanel()"
      (concernClick)="openConcernModal($event)"
      (endpointClick)="openEndpointModal($event)"
      (dqRuleClick)="openDqRuleModal($event)"
    ></app-detail-panel>
  </div>
  <app-lineage-modal
    [dataElement]="lineageElement"
    [open]="lineageModalOpen"
    (openChange)="onLineageOpenChange($event)"
  ></app-lineage-modal>
  <app-endpoint-detail-modal
    [endpoint]="endpointForModal"
    [open]="endpointModalOpen"
    (openChange)="onEndpointModalOpenChange($event)"
  ></app-endpoint-detail-modal>
  <app-dq-rule-detail-modal
    [rule]="dqRuleForModal"
    [open]="dqRuleModalOpen"
    (openChange)="onDqRuleModalOpenChange($event)"
  ></app-dq-rule-detail-modal>
</div>
