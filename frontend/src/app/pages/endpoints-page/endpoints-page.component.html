<div class="space-y-4">
  <h2 class="text-xl font-semibold text-slate-100">Endpoints</h2>
  <p class="text-slate-400 text-sm">Select a domain to load endpoints.</p>
  <div *ngIf="loading" class="text-sky-400">Loading…</div>
  <div *ngIf="!loading && endpoints.length === 0" class="text-slate-500">No endpoints.</div>
  <div *ngIf="!loading && endpoints.length > 0" class="rounded-lg border border-slate-700 bg-slate-800 overflow-hidden">
    <table class="min-w-full divide-y divide-slate-700">
      <thead class="bg-slate-700/50">
        <tr>
          <th class="px-4 py-2 text-left text-xs font-medium text-slate-400 uppercase">Name</th>
          <th class="px-4 py-2 text-left text-xs font-medium text-slate-400 uppercase">Description</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-700">
        <tr *ngFor="let item of endpoints" class="hover:bg-slate-700/30 cursor-pointer" (click)="openDetail(item)">
          <td class="px-4 py-2 text-slate-200">{{ item.name }}</td>
          <td class="px-4 py-2 text-slate-400 text-sm">{{ item.description ?? '—' }}</td>
        </tr>
      </tbody>
    </table>
  </div>
  <app-detail-modal [title]="modalTitle" [rows]="modalRows" [(open)]="modalOpen"></app-detail-modal>
</div>
