<div class="flex flex-col flex-1 min-h-0 overflow-hidden">
  <div class="flex flex-wrap items-center justify-between gap-4 mb-4 flex-shrink-0">
    <div class="min-w-0">
      <h2 class="text-xl font-semibold text-gray-100 mb-1">Applications</h2>
      <p class="page-subtitle">Select a domain to load applications.</p>
    </div>
    <div class="flex-shrink-0">
      <app-time-period-switch></app-time-period-switch>
    </div>
  </div>
  <app-concept-metrics *ngIf="!loading" [metrics]="metrics"></app-concept-metrics>
  <div class="flex items-center gap-4 mb-3 flex-shrink-0" *ngIf="currentDomainId != null">
    <app-table-search-filter [(value)]="searchTerm" placeholder="Search…"></app-table-search-filter>
    <div class="flex gap-1">
      <button type="button" class="domain-scope-tab" [class.domain-scope-tab--active]="domainScope === 'owned'" (click)="setDomainScope('owned')">Owned by Domain</button>
      <button type="button" class="domain-scope-tab" [class.domain-scope-tab--active]="domainScope === 'upstream'" (click)="setDomainScope('upstream')">Upstream of Domain</button>
      <button type="button" class="domain-scope-tab" [class.domain-scope-tab--active]="domainScope === 'downstream'" (click)="setDomainScope('downstream')">Downstream of Domain</button>
    </div>
  </div>
  <div *ngIf="loading" class="loading-spinner mb-4 flex-shrink-0">Loading applications…</div>
  <div *ngIf="!loading && applications.length === 0" class="empty-state mb-4 flex-shrink-0">
    <span class="iconoir-app-window empty-state__icon" aria-hidden="true"></span>
    <span class="empty-state__title">No applications</span>
    <span class="empty-state__hint" *ngIf="currentDomainId != null">No applications match the current domain and scope. Try another scope or domain.</span>
    <span class="empty-state__hint" *ngIf="currentDomainId == null">Select a domain above to load applications.</span>
  </div>
  <div class="flex flex-1 min-h-0 gap-gutter" *ngIf="!loading && applications.length > 0">
    <div class="main-content" [class.main-content--panel-open]="selectedItem">
      <div class="ag-theme-quartz h-full min-h-[200px]">
        <ag-grid-angular
          theme="legacy"
          [rowData]="applications"
          [quickFilterText]="searchTerm"
          [columnDefs]="columnDefs"
          [defaultColDef]="defaultColDef"
          [rowSelection]="{ mode: 'multiRow', enableClickSelection: false }"
          (rowClicked)="onRowClicked($event.data)"
          [getRowId]="getRowId"
          class="ag-grid-full-height"
        ></ag-grid-angular>
      </div>
    </div>
    <app-detail-panel [title]="panelTitle" [rows]="panelRows" [open]="!!selectedItem" (openChange)="closePanel()"></app-detail-panel>
  </div>
</div>
