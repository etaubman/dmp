<div class="login-page flex min-h-screen bg-aurora-bg text-gray-100 items-center justify-center p-4">
  <div class="card-aurora login-card w-full max-w-md p-8" style="border: 1px solid rgba(255,255,255,0.06);">
    <div class="flex flex-col gap-6">
      <header class="text-center">
        <h1 class="text-xl font-semibold tracking-tight">
          <span class="text-accent font-semibold">Data</span> Manager Portal
        </h1>
        <p class="text-gray-500 text-sm mt-2">Sign in to continue</p>
      </header>

      <form (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
        <div>
          <label for="login-email" class="block text-sm font-medium text-gray-400 mb-1.5">Email</label>
          <input
            id="login-email"
            type="email"
            [(ngModel)]="email"
            name="email"
            autocomplete="email"
            required
            class="w-full rounded-input px-3 py-2.5 text-sm text-gray-200 bg-aurora-card border border-white/10 focus:ring-1 focus:ring-accent-pop focus:border-accent-pop focus:outline-none"
            placeholder="you@example.com"
          />
        </div>
        <div>
          <label for="login-password" class="block text-sm font-medium text-gray-400 mb-1.5">Password</label>
          <input
            id="login-password"
            type="password"
            [(ngModel)]="password"
            name="password"
            autocomplete="current-password"
            required
            class="w-full rounded-input px-3 py-2.5 text-sm text-gray-200 bg-aurora-card border border-white/10 focus:ring-1 focus:ring-accent-pop focus:border-accent-pop focus:outline-none"
            placeholder="••••••••"
          />
        </div>
        <div *ngIf="authError$ | async as err" class="text-sm text-red-400">
          {{ err }}
        </div>
        <button
          type="submit"
          class="mt-2 w-full py-2.5 px-4 rounded-input font-medium text-sm bg-accent-pop text-white hover:bg-accent-pop-hover focus:ring-2 focus:ring-accent-pop focus:ring-offset-2 focus:ring-offset-aurora-bg transition-colors"
        >
          Sign in
        </button>
      </form>
    </div>
  </div>
</div>
