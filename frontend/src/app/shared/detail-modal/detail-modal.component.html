<div *ngIf="open" class="fixed inset-0 flex items-center justify-center bg-black/60" style="z-index: 9999;" (click)="close()">
  <div class="bg-aurora-card rounded-card shadow-xl max-w-lg w-full mx-4 max-h-[80vh] overflow-hidden flex flex-col" style="border: 1px solid rgba(255,255,255,0.06);" (click)="$event.stopPropagation()">
    <div class="flex items-center justify-between px-4 py-3" style="border-bottom: 1px solid rgba(255,255,255,0.06);">
      <h3 class="text-lg font-medium text-gray-100">{{ title }}</h3>
      <button type="button" class="text-gray-500 hover:text-gray-200 transition-colors" (click)="close()">✕</button>
    </div>
    <div class="p-4 overflow-auto">
      <dl class="space-y-2">
        <div *ngFor="let row of rows" class="flex">
          <dt class="w-40 flex-shrink-0 text-gray-500 text-sm">{{ row.label }}</dt>
          <dd class="text-gray-200 text-sm">{{ row.value ?? '—' }}</dd>
        </div>
      </dl>
    </div>
  </div>
</div>
