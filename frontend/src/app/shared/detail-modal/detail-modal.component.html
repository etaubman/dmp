<div *ngIf="open" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60" (click)="close()">
  <div class="bg-slate-800 border border-slate-600 rounded-lg shadow-xl max-w-lg w-full mx-4 max-h-[80vh] overflow-hidden flex flex-col" (click)="$event.stopPropagation()">
    <div class="flex items-center justify-between px-4 py-3 border-b border-slate-700">
      <h3 class="text-lg font-medium text-slate-100">{{ title }}</h3>
      <button type="button" class="text-slate-400 hover:text-white" (click)="close()">✕</button>
    </div>
    <div class="p-4 overflow-auto">
      <dl class="space-y-2">
        <div *ngFor="let row of rows" class="flex">
          <dt class="w-40 flex-shrink-0 text-slate-500 text-sm">{{ row.label }}</dt>
          <dd class="text-slate-200 text-sm">{{ row.value ?? '—' }}</dd>
        </div>
      </dl>
    </div>
  </div>
</div>
