<!-- Wrapper always present so container has size before diagram mounts (fixes black empty canvas) -->
<div #diagramWrap class="lineage-modal__diagram">
  <ng-diagram
    *ngIf="model()"
    [model]="model()!"
    [config]="config"
    [nodeTemplateMap]="nodeTemplateMap"
    (diagramInit)="onDiagramInit()"
    (viewportChanged)="onViewportChanged($event)"
    (selectionChanged)="onSelectionChanged($event)"
  ></ng-diagram>
  <button *ngIf="model()" type="button" class="lineage-modal__recenter" title="Recenter diagram" (click)="recenter()" aria-label="Recenter diagram">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
  </button>
</div>
